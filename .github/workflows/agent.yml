name: agent
on:
  push:
    paths: ["agent/**", ".github/workflows/agent.yml"]
  pull_request:
    paths: ["agent/**", ".github/workflows/agent.yml"]
jobs:
  test:
    # 두 OS 를 모두 도는 것은 중복이 아니다. 봇은 리눅스(Railway), 워커는 윈도우(미니PC)에서
    # 돌고, 경로 처리 테스트 상당수가 it.skipIf(process.platform ...) 로 한쪽에서만 실행된다 —
    # 특히 워커의 최종 경로 관문(tests/remoteRoots.test.ts 의 checkPath) 5건은 윈도우에서만
    # 돈다. 리눅스만 돌리면 그 관문이 CI 에서 한 번도 검증되지 않는다.
    # 타입체크도 양쪽에서 돌린다 — import 경로의 대소문자 불일치는 리눅스에서만 드러난다.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: 의존성 설치
        run: npm ci
      - name: 타입체크
        run: npm run typecheck
      - name: 단위 테스트 (vitest)
        run: npm test
